server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Emit a RELATIVE Location (`Location: /docs/`) for nginx's own directory redirects. nginx only
    # sees plain http on :80 behind the TLS-terminating proxies (Cloudflare -> ingress), so an absolute
    # redirect came out as `https://docs.traduora.co/docs -> 301 http://docs.traduora.co/docs/`: a
    # protocol downgrade that Cloudflare then bounced back to https. A relative Location keeps the
    # client on the scheme and host it already used.
    absolute_redirect off;

    # Security headers, the baseline of every Ever website (ever.co). `always` sends them with every
    # status, the 301s and 404s included. nginx drops ALL server-level add_header lines in a location
    # that sets an add_header of its own, so the asset location below repeats this set.
    # No HSTS here: the Cloudflare zone sends it. server_tokens off keeps the nginx version out of the
    # Server header and the error pages.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # RFC 9116 security.txt, answered by nginx itself so it does not depend on the Docusaurus build
    # copying a dot-directory out of static/. An exact-match location wins over every other one, so
    # no built file can shadow it. It sets no add_header, so it inherits the set above.
    # Renew Expires before 2027-11-19. No Policy field (optional in RFC 9116): ever-co/ever-traduora
    # has no SECURITY.md, so its policy page is empty. Add `Policy: <url>` once a policy is published.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: mailto:security@ever.co\nExpires: 2027-11-19T00:00:00.000Z\nPreferred-Languages: en\nCanonical: https://docs.traduora.co/.well-known/security.txt\n";
    }

    # Docusaurus v1 cleanUrl: requests for /page resolve to /page/index.html or /page.html.
    # This is a multi-page site, so do NOT SPA-fallback to a single index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Long-cache immutable hashed assets
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # Its own add_header above drops the server-level set, so it is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        try_files $uri =404;
    }
}

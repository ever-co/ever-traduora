version: '3.7'

services:
  traduora:
    image: everco/ever-traduora:latest
    container_name: traduora
    ports:
      - '8080:8080'
    environment:
      TR_SECRET: ${TR_SECRET:-}
      TR_DB_TYPE: better-sqlite3
      TR_DB_SQLITE_PATH: ${TR_DB_SQLITE_PATH:-api/data/tr_dev.sqlite3}
      NODE_ENV: ${NODE_ENV:-development}
      # Anonymous usage statistics are on by default; 'false' turns them off entirely, see
      # docs/ever-platform/anonymous-usage-statistics.md
      # TR_EVER_STATS_ENABLED: 'false'
    entrypoint: './docker-entrypoint.compose.sh'
    restart: on-failure
    volumes:
      - ./traduora_sqlite_data:/app/api/data
    networks:
      - overlay

networks:
  overlay:
    driver: bridge
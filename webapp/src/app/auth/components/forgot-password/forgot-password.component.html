<div class="d-flex flex-column align-items-center h-100 px-3 py-4 auth-page">
  <app-logo class="mb-4"></app-logo>
  <div class="card auth-card">
    <div class="card-body">
      <div *ngIf="errorMessage$ | async as errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
      <div *ngIf="statusMessage$ | async as statusMessage" class="alert alert-info">{{ statusMessage }}</div>
      <div *ngIf="settingsStatus === 'failed'" class="alert alert-danger" role="alert">
        The form could not load its settings.
        <button type="button" class="btn btn-link p-0 align-baseline" (click)="retrySettings()">Try again</button>
      </div>

      <h4 class="card-title font-serif">Forgot your password?</h4>

      <p class="card-text">Enter the email address of your account, and we will send you a link to reset your password.</p>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="emailInput">Email address</label>
          <input
            id="emailInput"
            class="form-control"
            type="email"
            formControlName="email"
            [ngClass]="{ 'is-invalid': email.touched && email.invalid }"
            autocomplete="email"
          />

          <div class="invalid-feedback">
            <div *ngIf="email.getError('required')">Email is required</div>
            <div *ngIf="email.getError('email')">Must be a valid email</div>
          </div>
        </div>

        <div *ngIf="turnstileSiteKey" class="form-group">
          <app-turnstile [siteKey]="turnstileSiteKey" action="forgot-password" (token)="turnstileToken = $event"></app-turnstile>
        </div>

        <button type="submit" [disabled]="!ready || (isLoading$ | async)" class="btn btn-primary w-100">Send password reset link</button>
      </form>
    </div>
  </div>
  <div class="mt-3 text-center">
    <a class="btn btn-link text-sm" routerLink="/login">Back to sign in</a>
  </div>
</div>
